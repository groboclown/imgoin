name: Build and Validate
on:
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu Cgo
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v3
      
      - name: Install OS Dependencies
        # The base setup should already have many of these installed,
        # but this makes it explicit.
        # Even with this explicit golang version install, the dependencies
        # install into the standard go home directory, rather than the
        # version directory.
        run: |
          set +x
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
              libbtrfs-dev libassuan-dev libgpgme-dev \
              gcc-aarch64-linux-gnu golang \
              make \
              ca-certificates \
              openssl
          go install golang.org/dl/go1.26.8@latest
          $HOME/go/bin/go1.26.8 download
          export GOROOT=$($HOME/go/bin/go1.26.8 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          make go-dependencies
          echo $GOROOT/bin
          ls $GOROOT/bin
          echo $HOME/go/bin
          ls $HOME/go/bin

      - name: Build & Test
        # This uses a hack to patch the images/signatures package.
        # Without it, the go.podman.io/image/v5/signature package will pull
        # in the golang.org/x/crypto/openpgp package, which suffers from
        # GO-2026-5932.

        # Also, for some reason I haven't figured out yet, the cyclonedx
        # sbom generator doesn't work right if running with this vendored
        # environment for cross platform.  That unfortunately mis-directs
        # the vulnerabilities to include the bad openpgp package, though.
        run: |
          export GOROOT=$($HOME/go/bin/go1.26.5 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          make all-sboms
          make all CC_ARM64=aarch64-linux-gnu-gcc

  ubuntu-no-cgo:
    name: Ubuntu No Cgo
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v3
      
      - name: Install OS Dependencies
        # The base setup should already have many of these installed,
        # but this makes it explicit.
        # Even with this explicit golang version install, the dependencies
        # install into the standard go home directory, rather than the
        # version directory.
        run: |
          set +x
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
              gcc-aarch64-linux-gnu golang \
              make \
              ca-certificates \
              openssl
          go install golang.org/dl/go1.26.8@latest
          $HOME/go/bin/go1.26.8 download
          export GOROOT=$($HOME/go/bin/go1.26.8 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          make go-dependencies
          echo $GOROOT/bin
          ls $GOROOT/bin
          echo $HOME/go/bin
          ls $HOME/go/bin

      - name: Build & Test
        # This uses a hack to patch the images/signatures package.
        # Without it, the go.podman.io/image/v5/signature package will pull
        # in the golang.org/x/crypto/openpgp package, which suffers from
        # GO-2026-5932.

        # Also, for some reason I haven't figured out yet, the cyclonedx
        # sbom generator doesn't work right if running with this vendored
        # environment for cross platform.  That unfortunately mis-directs
        # the vulnerabilities to include the bad openpgp package, though.
        run: |
          export GOROOT=$($HOME/go/bin/go1.26.8 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          make CGO_ENABLED=0 all-sboms
          make CGO_ENABLED=0 all
