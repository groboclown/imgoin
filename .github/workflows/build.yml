name: Build and Validate
on:
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v3
      
      - name: Install OS Dependencies
        # The base setup should already have many of these installed,
        # but this makes it explicit.
        # Even with this explicit golang version install, the dependencies
        # install into the standard go home directory, rather than the
        # version directory.
        run: |
          set +x
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
              libbtrfs-dev \
              libassuan-dev \
              libgpgme-dev \
              golang \
              clang \
              make \
              ca-certificates \
              openssl
          go install golang.org/dl/go1.26.5@latest
          $HOME/go/bin/go1.26.5 download
          export GOROOT=$($HOME/go/bin/go1.26.5 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          make go-dependencies
          echo $GOROOT/bin
          ls $GOROOT/bin
          echo $HOME/go/bin
          ls $HOME/go/bin

      - name: Build & Test
        # Because this uses some libraries that use CGO, it can't compile
        # easily to non-native architectures.
        # There's also a problem when running for Windows, where it
        # generates the error:
        #   gcc: error: unrecognized command-line option '-mthreads'; did you mean '-pthread'?
        # darwin has its own set of issues, specifically:
        #   clang: error: unsupported option '-arch' for target 'x86_64-pc-linux-gnu'
        run: |
          export GOROOT=$($HOME/go/bin/go1.26.5 env GOROOT)
          export PATH=$GOROOT/bin:$HOME/go/bin:$PATH
          export CGO_ENABLED=1
          make all SUPPORTED_PLATFORMS="linux-amd64"
