name: Build and Validate
on:
    pull_request:

jobs:
    ubuntu:
        name: Ubuntu
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.properties.outputs.version }}
            changelog: ${{ steps.properties.outputs.changelog }}
        steps:
            - name: Fetch Sources
              uses: actions/checkout@v3
            
            - name: Install OS Dependencies
              # The base setup should already have many of these installed,
              # but this makes it explicit.
              # This needs to install golang-backports to allow Ubuntu 24.04
              # installation of go 1.26.
              run: |
                set +x
                sudo apt-get update
                DEBIAN_FRONTEND=noninteractive sudo apt-get install -y software-properties-common
                sudo add-apt-repository ppa:longsleep/golang-backports -y
                DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
                    libbtrfs-dev \
                    libassuan-dev \
                    libgpgme-dev \
                    golang-1.26 \
                    make \
                    ca-certificates \
                    openssl
                make go-dependencies

            - name: Build & Test
              run: |
                make all
