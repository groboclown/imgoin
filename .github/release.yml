# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Minor Changes
      labels:
        - '*'
      exclude:
        labels:
          - enhancement
          - bug
          - dependencies
    - title: Dependency updates
      labels:
        - dependencies
